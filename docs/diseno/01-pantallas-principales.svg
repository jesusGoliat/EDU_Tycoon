<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Bosquejo de pantallas principales — EduTycoon</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Pantallas principales (orientación horizontal)</text>

  <!-- 1. Inicio -->
  <g transform="translate(40,70)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">1 · Inicio (Bienvenida)</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <rect x="20" y="30" width="480" height="214" fill="#e2e2e2" stroke="#999" stroke-dasharray="6 4"/>
    <text x="260" y="85" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">EDU-TYCOON</text>
    <text x="260" y="112" text-anchor="middle" font-size="13" fill="#555">Construye tu imperio educativo</text>
    <rect x="175" y="150" width="170" height="54" fill="#9fcf7a" stroke="#333" stroke-width="2"/>
    <text x="260" y="184" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">START</text>
    <text x="260" y="232" text-anchor="middle" font-size="11" fill="#777">(fondo ilustrado del campus)</text>
  </g>

  <!-- 2. Selección de partida -->
  <g transform="translate(640,70)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">2 · Selección de partida</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <g font-size="12" text-anchor="middle" fill="#222">
      <rect x="30" y="50" width="140" height="80" fill="#9fcf7a" stroke="#333" stroke-width="2"/>
      <text x="100" y="95" font-weight="bold">+ NUEVA PARTIDA</text>
      <text x="100" y="148" fill="#555">Slot 1 vacío</text>
      <rect x="190" y="50" width="140" height="80" fill="#9fcf7a" stroke="#333" stroke-width="2"/>
      <text x="260" y="88" font-weight="bold">Partida guardada</text>
      <text x="260" y="106">$360.0K · Ciclo 4</text>
      <text x="260" y="148" fill="#555">Slot 2</text>
      <rect x="350" y="50" width="140" height="80" fill="#9fcf7a" stroke="#333" stroke-width="2"/>
      <text x="420" y="95" font-weight="bold">+ NUEVA PARTIDA</text>
      <text x="420" y="148" fill="#555">Slot 3 vacío</text>
      <rect x="190" y="180" width="140" height="44" fill="#9fcf7a" stroke="#333" stroke-width="2"/>
      <text x="260" y="207" font-weight="bold" font-size="15">VOLVER</text>
    </g>
  </g>

  <!-- 3. Mapa del campus -->
  <g transform="translate(40,390)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">3 · Mapa del campus (tarea principal)</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <polygon points="60,240 250,70 470,170 330,245" fill="#cfe3b8" stroke="#777"/>
    <line x1="160" y1="150" x2="380" y2="210" stroke="#888"/>
    <line x1="250" y1="70" x2="250" y2="240" stroke="#888"/>
    <rect x="20" y="28" width="300" height="26" fill="#333" opacity="0.85"/>
    <text x="30" y="46" font-size="13" fill="#f0c040">$500.0K</text>
    <text x="110" y="46" font-size="13" fill="#6fd3e0">Alumnos: 0</text>
    <text x="210" y="46" font-size="13" fill="#f0c040">Reputación: 0%</text>
    <circle cx="480" cy="42" r="17" fill="#7a1f3d" stroke="#333"/>
    <text x="480" y="47" text-anchor="middle" font-size="14" fill="#fff">⚙</text>
    <rect x="300" y="112" width="120" height="20" fill="#555"/>
    <text x="360" y="126" text-anchor="middle" font-size="11" fill="#fff">Edificio de Cafetería</text>
    <rect x="120" y="178" width="150" height="20" fill="#555"/>
    <text x="195" y="192" text-anchor="middle" font-size="11" fill="#fff">Escuela de Computación</text>
  </g>

  <!-- 4. Ventana de compra -->
  <g transform="translate(640,390)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">4 · Ventana de compra (Gestión del Plantel)</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <rect x="130" y="26" width="260" height="222" fill="#2b2b2b" stroke="#4a90c2" stroke-width="2"/>
    <g font-size="12" text-anchor="middle">
      <text x="160" y="46" text-anchor="start" fill="#eee">Gestión del Plantel</text>
      <text x="376" y="46" fill="#eee">×</text>
      <text x="260" y="72" fill="#f0c040">Cafetería</text>
      <text x="260" y="92" fill="#ccc">Lugar para comer rico</text>
      <text x="260" y="116" fill="#eee">Capacidad: 500 alumnos</text>
      <text x="260" y="136" fill="#5bd35b">Ingreso al comprar: $1.0K/ciclo</text>
      <text x="260" y="160" fill="#bbb">Tu saldo: $500.0K</text>
      <rect x="150" y="200" width="220" height="30" fill="#444" stroke="#666"/>
      <text x="260" y="220" fill="#eee" font-size="13">COMPRAR  $150.0K</text>
    </g>
  </g>

  <!-- Flechas de navegación -->
  <g stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M560,210 L636,210"/>
    <path d="M900,340 C900,372 470,352 470,398"/>
    <path d="M560,540 L636,540"/>
  </g>
  <g font-size="12" fill="#444">
    <text x="566" y="200">START</text>
    <text x="600" y="354">Slot → tutorial → mapa</text>
    <text x="566" y="530">tocar terreno</text>
  </g>

  <text x="600" y="688" text-anchor="middle" font-size="12" fill="#555">Bosquejo de baja fidelidad basado en las pantallas reales del juego. Elaborado por Jesús Ángel González Arellano con apoyo de IA (Claude).</text>
</svg>
