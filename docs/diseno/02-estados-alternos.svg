<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Bosquejo de estados alternos — EduTycoon</title>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Estados fuera de la ruta feliz</text>

  <!-- A. Carga -->
  <g transform="translate(40,70)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">A · Carga — al abrir o cargar una partida</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <text x="260" y="110" text-anchor="middle" font-size="18" fill="#333">Cargando campus…</text>
    <rect x="130" y="130" width="260" height="16" fill="#fff" stroke="#333"/>
    <rect x="130" y="130" width="150" height="16" fill="#9fcf7a"/>
    <text x="260" y="180" text-anchor="middle" font-size="12" fill="#555">Mapa (Tiled), texturas y datos del slot</text>
    <text x="260" y="238" text-anchor="middle" font-size="11" fill="#b04040">Propuesto: hoy el juego no muestra indicador de carga</text>
  </g>

  <!-- B. Lista vacía -->
  <g transform="translate(640,70)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">B · Lista vacía — sin partidas guardadas</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <g font-size="12" text-anchor="middle" fill="#222">
      <rect x="30" y="50" width="140" height="80" fill="#e6e6e6" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="100" y="95" font-weight="bold">+ NUEVA PARTIDA</text>
      <text x="100" y="148" fill="#555">Slot 1 vacío</text>
      <rect x="190" y="50" width="140" height="80" fill="#e6e6e6" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="260" y="95" font-weight="bold">+ NUEVA PARTIDA</text>
      <text x="260" y="148" fill="#555">Slot 2 vacío</text>
      <rect x="350" y="50" width="140" height="80" fill="#e6e6e6" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="420" y="95" font-weight="bold">+ NUEVA PARTIDA</text>
      <text x="420" y="148" fill="#555">Slot 3 vacío</text>
      <text x="260" y="190" fill="#333">«Aún no tienes partidas. Elige un slot para empezar.»</text>
      <text x="260" y="238" font-size="11" fill="#555">Existe en el juego (slots vacíos); el mensaje de ayuda es propuesto</text>
    </g>
  </g>

  <!-- C. Error -->
  <g transform="translate(40,390)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">C · Error — no se pudo cargar o guardar</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <rect x="110" y="50" width="300" height="160" fill="#2b2b2b" stroke="#c24a4a" stroke-width="2"/>
    <g font-size="13" text-anchor="middle">
      <text x="260" y="82" fill="#ff6b6b" font-weight="bold">No se pudo cargar la partida</text>
      <text x="260" y="110" fill="#ddd">El archivo del Slot 2 está dañado.</text>
      <text x="260" y="130" fill="#ddd">Tu progreso de otros slots está a salvo.</text>
      <rect x="140" y="160" width="110" height="32" fill="#444" stroke="#777"/>
      <text x="195" y="181" fill="#eee">Reintentar</text>
      <rect x="270" y="160" width="110" height="32" fill="#444" stroke="#777"/>
      <text x="325" y="181" fill="#eee">Volver</text>
    </g>
    <text x="260" y="238" text-anchor="middle" font-size="11" fill="#b04040">Propuesto: hoy los errores de carga sólo van al log (MAP_ERROR)</text>
  </g>

  <!-- D. Datos inválidos -->
  <g transform="translate(640,390)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#222">D · Dato inválido — compra no permitida</text>
    <rect x="0" y="12" width="520" height="250" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <g font-size="12" text-anchor="middle">
      <rect x="20" y="30" width="230" height="190" fill="#2b2b2b" stroke="#4a90c2" stroke-width="2"/>
      <text x="135" y="54" fill="#f0c040">Biológicas</text>
      <text x="135" y="84" fill="#bbb">Tu saldo: $360.0K</text>
      <text x="135" y="112" fill="#ff5050" font-weight="bold">Te faltan $890.0K</text>
      <rect x="40" y="170" width="190" height="30" fill="#3a3a3a" stroke="#555"/>
      <text x="135" y="190" fill="#777">COMPRAR  $1.25M</text>
      <text x="135" y="240" fill="#333" font-size="11">Saldo insuficiente (deshabilitado)</text>
      <rect x="270" y="30" width="230" height="190" fill="#2b2b2b" stroke="#4a90c2" stroke-width="2"/>
      <text x="385" y="54" fill="#f0c040">Cafetería · nivel 2/2</text>
      <text x="385" y="112" fill="#ff5050" font-weight="bold">(o) Costo inválido:</text>
      <text x="385" y="130" fill="#ff5050">no se puede comprar</text>
      <rect x="290" y="170" width="190" height="30" fill="#3a3a3a" stroke="#555"/>
      <text x="385" y="190" fill="#777">NIVEL MÁXIMO</text>
      <text x="385" y="240" fill="#333" font-size="11">Nivel máximo / costo ≤ 0 (deshabilitado)</text>
    </g>
  </g>

  <text x="600" y="688" text-anchor="middle" font-size="12" fill="#555">Bosquejo de baja fidelidad. D ya está implementado (PR #2); A, C y el mensaje de B son propuestas. Elaborado por Jesús Ángel González Arellano con apoyo de IA (Claude).</text>
</svg>
