<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Esquema de la pantalla de juego — EduTycoon</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Pantalla de juego: elementos y controles</text>

  <!-- Teléfono -->
  <g transform="translate(40,70)">
    <rect x="0" y="0" width="720" height="340" rx="24" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <rect x="24" y="18" width="672" height="304" fill="#1a1a1a"/>
    <polygon points="90,300 330,80 640,210 450,315" fill="#8db84f" stroke="#555"/>
    <line x1="210" y1="190" x2="540" y2="262" stroke="#666" stroke-width="2"/>
    <line x1="330" y1="80" x2="330" y2="312" stroke="#666" stroke-width="2"/>
    <!-- edificio comprado -->
    <rect x="470" y="135" width="95" height="60" fill="#b07a4a" stroke="#333"/>
    <text x="517" y="170" text-anchor="middle" font-size="11" fill="#fff">CAFÉ Lvl 1</text>
    <!-- etiquetas -->
    <rect x="175" y="220" width="160" height="20" fill="#3d4a2f"/>
    <text x="255" y="234" text-anchor="middle" font-size="11" fill="#fff">Escuela de Computación</text>
    <!-- HUD -->
    <rect x="40" y="30" width="330" height="28" fill="#333" opacity="0.9"/>
    <text x="52" y="49" font-size="14" fill="#f0c040">$360.0K</text>
    <text x="140" y="49" font-size="14" fill="#6fd3e0">Alumnos: 100</text>
    <text x="262" y="49" font-size="14" fill="#f0c040">Reput.: 2%</text>
    <!-- engrane -->
    <circle cx="660" cy="46" r="20" fill="#7a1f3d" stroke="#ddd"/>
    <text x="660" y="52" text-anchor="middle" font-size="16" fill="#fff">⚙</text>
    <!-- toast -->
    <rect x="290" y="262" width="150" height="48" fill="#222" opacity="0.85"/>
    <text x="365" y="282" text-anchor="middle" font-size="12" fill="#5bd35b">Ingresos: +10.0K</text>
    <text x="365" y="300" text-anchor="middle" font-size="12" fill="#6fd3e0">Alumnos: 100</text>

    <!-- marcadores numerados -->
    <g font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      <circle cx="40" cy="30" r="13" fill="#d9480f"/><text x="40" y="35">1</text>
      <circle cx="640" cy="26" r="13" fill="#d9480f"/><text x="640" y="31">2</text>
      <circle cx="470" cy="135" r="13" fill="#d9480f"/><text x="470" y="140">3</text>
      <circle cx="175" cy="220" r="13" fill="#d9480f"/><text x="175" y="225">4</text>
      <circle cx="290" cy="262" r="13" fill="#d9480f"/><text x="290" y="267">5</text>
    </g>
  </g>

  <!-- Leyenda de elementos -->
  <g transform="translate(800,80)" font-size="14" fill="#222">
    <text x="0" y="0" font-size="17" font-weight="bold">Elementos</text>
    <text x="0" y="30"><tspan font-weight="bold" fill="#d9480f">1</tspan>  HUD: saldo, alumnos y reputación</text>
    <text x="0" y="56"><tspan font-weight="bold" fill="#d9480f">2</tspan>  Engrane: menú de pausa</text>
    <text x="22" y="76" font-size="12" fill="#555">Guardar partida · Estadísticas · Audio ·</text>
    <text x="22" y="92" font-size="12" fill="#555">Menú principal</text>
    <text x="0" y="118"><tspan font-weight="bold" fill="#d9480f">3</tspan>  Edificio comprado (sprite por nivel)</text>
    <text x="0" y="144"><tspan font-weight="bold" fill="#d9480f">4</tspan>  Terreno disponible con su etiqueta</text>
    <text x="0" y="170"><tspan font-weight="bold" fill="#d9480f">5</tspan>  Aviso de fin de ciclo (ingresos)</text>

    <text x="0" y="220" font-size="17" font-weight="bold">Controles (táctiles)</text>
    <text x="0" y="250">☝  Tocar terreno → ventana de compra</text>
    <text x="0" y="276">☝  Tocar diálogo → avanzar tutorial</text>
    <text x="0" y="302">✋  Arrastrar → mover la cámara</text>
    <text x="0" y="328">🤏  Pellizcar → acercar / alejar</text>
    <text x="0" y="354">⚙  Tocar engrane → pausa</text>
    <text x="0" y="380">◁  Atrás de Android → sale al menú</text>
    <text x="22" y="398" font-size="12" fill="#b04040">(hoy pierde la partida, issue #4)</text>
  </g>

  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#333">Controles tomados de GameScreen.kt (GestureDetector: tap, pan, zoom) y PauseMenuWindow.kt.</text>
  <text x="600" y="545" text-anchor="middle" font-size="12" fill="#555">Esquema de baja fidelidad basado en el juego real. Elaborado por Jesús Ángel González Arellano con apoyo de IA (Claude).</text>
</svg>
